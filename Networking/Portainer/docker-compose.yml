services:
  portainer:
    image: portainer/portainer-ce:latest #always pull latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy #make sure that it's on the proxy network

volumes:
  portainer_data:

networks:
  proxy:
    external: true #make portainer see that proxy is external
    name: proxy
